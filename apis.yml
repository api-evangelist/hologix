name: Hologix
description: Hologix, Inc. (formerly MBA Technologies, founded 1989) was a Phoenix, Arizona software
  company that developed Attricom, a business-to-business eCommerce order management solution built for
  manufacturers with complex, attribute-based product lines in the metals, textile, and paper and forest
  products industries. Attricom streamlined configuration, quoting, and order management so large-scale
  producers could offer closer, self-service ordering relationships to their customers. Hologix was
  venture-backed by Insight Partners, Adams Capital Management, Integral Capital Partners, and Kemper
  Ventures, and has since ceased operations. It is retained in the API Evangelist network as a portfolio
  lead; no public API, developer portal, or product website is currently reachable.
